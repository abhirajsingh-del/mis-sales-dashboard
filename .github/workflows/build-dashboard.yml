# Rebuilds the dashboard whenever a monthly MIS workbook (input/), the pipeline or the page changes,
# then publishes docs/ to GitHub Pages. Settings > Pages > Source must be "GitHub Actions".
name: Build MIS dashboard

on:
  push:
    branches: [main]
    paths: ["input/**", "pipeline/**", "docs/**", ".github/workflows/build-dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mis-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Only when raw workbooks are kept in the repo; otherwise the committed docs/data.js is published as-is.
      - name: Run pipeline
        if: hashFiles('input/*.xlsx') != ''
        run: python pipeline/pipeline.py

      - name: Commit refreshed dashboard data
        if: hashFiles('input/*.xlsx') != ''
        run: |
          git config user.name "mis-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.js
          git diff --cached --quiet || git commit -m "Refresh dashboard data [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
